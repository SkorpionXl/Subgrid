name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: app/go.sum

      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; N="${V%%-*}.0"; else V="2.2.0-dev.${GITHUB_RUN_NUMBER}"; N="2.2.0.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "numver=$N" >> $GITHUB_OUTPUT

      - name: Web build + engine test
        shell: bash
        run: |
          npm ci
          node build.mjs
          node test/race.mjs | tail -5

      - name: Windows exes
        shell: bash
        working-directory: app
        env:
          CGO_ENABLED: '0'
          GOFLAGS: -mod=mod
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64
          for ED in studio lite; do
            go build -trimpath -ldflags "-H windowsgui -s -w -X main.edition=$ED -X main.version=${{ steps.v.outputs.version }}" -o ../build/SubGrid-$ED.exe .
          done

      - name: Smoke test (start the real exe, page must report ready)
        shell: pwsh
        run: |
          $ok = $true
          foreach ($ed in 'studio','lite') {
            $p = Start-Process -FilePath "build/SubGrid-$ed.exe" -ArgumentList '--selftest' -PassThru
            if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host "${ed}: timeout"; $ok = $false; continue }
            Write-Host "${ed} exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { $ok = $false }
          }
          Get-Content "$env:LOCALAPPDATA\SubGrid\subgrid.log" -Tail 40
          if (-not $ok) { exit 1 }

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress; $env:PATH += ";C:\Program Files (x86)\NSIS" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/SubGrid-lite.exe dist/SubGrid-Lite.exe
          Push-Location installer
          makensis -V2 "-DVERSION=${{ steps.v.outputs.version }}" "-DNUMVER=${{ steps.v.outputs.numver }}" "-DEXE=../build/SubGrid-studio.exe" "-DOUT=../dist/SubGrid-Studio-Setup.exe" subgrid-studio.nsi
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: SubGrid-${{ steps.v.outputs.version }}
          path: |
            dist/SubGrid-Studio-Setup.exe
            dist/SubGrid-Lite.exe
            dist/SubGrid-Lite.html

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SubGrid ${{ steps.v.outputs.version }}
          files: |
            dist/SubGrid-Studio-Setup.exe
            dist/SubGrid-Lite.exe
            dist/SubGrid-Lite.html
